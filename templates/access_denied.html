<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied - NMIET Lost & Found</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 45px 30px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            color: #c62828;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #0b4ea2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #083b7d;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="icon">🔒</div>

        <h1>Access Denied</h1>

        <p>
            {{ message }}
        </p>

        <a href="{{ url_for('home') }}">
            Back to Home
        </a>

    </div>

</body>
</html>
